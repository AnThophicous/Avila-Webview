name: CI

on:
  push:
    branches:
      - main
    tags:
      - "26.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\Avila-Webview.sln

      - name: Test
        run: dotnet test .\Avila-Webview.sln --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/26.')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release bootstrap
        run: dotnet publish .\src\Avila.CLI\Avila.CLI.csproj -c Release -r win-x64 -o .\buildclear\bootstrap-cli --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false

      - name: Build release bundle
        run: .\buildclear\bootstrap-cli\avila.exe publish --output .\buildclear\release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            buildclear/release/*.zip
            buildclear/release/*.sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
