<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Window</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./main.js"></script>
  </head>
  <body>
    <header class="titlebar" data-avila-drag>
      <span>Custom Window</span>
      <div class="actions" data-avila-no-drag>
        <button id="mica">Mica</button>
        <button id="rounded">Corners</button>
        <button id="center">Center</button>
      </div>
    </header>
    <main>
      <h1>Native window controls</h1>
      <p>Drag the top bar and toggle native DWM settings through the secure bridge.</p>
    </main>
  </body>
</html>
